name: Auto-Version on Release Branch

on:

  create

jobs:

  auto-version:

    if: github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/release/')

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v3



      - name: Debug branch name

        run: |

          echo "Branch name: ${{ github.ref_name }}"



      - name: Extract version from branch name

        id: extract_version

        run: |

          VERSION=$(echo "${{ github.ref_name }}" | sed 's/release\///')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"



      - name: Create or update version.json

        run: |

          mkdir -p config

          echo "{\"version\": \"${{ steps.extract_version.outputs.version }}\"}" > config/version.json

          

      - name: Commit and push version.json

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add config/version.json

          git commit -m "Archivo de version ${{ steps.extract_version.outputs.version }} autogenerado" || echo "No changes to commit"

          git push origin "${{ github.ref_name }}"